{% extends 'base.html' %}

{% block title %}Page Not Found (404) — Avsar (अवसर){% endblock %}

{% block content %}
<div class="container py-5 text-center my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="avsar-card p-5">
                <div class="mb-3">
                    <i class="bi bi-compass fs-1 text-success" aria-hidden="true"></i>
                </div>
                <h1 class="h3 fw-bold text-charcoal mb-2">Page Not Found</h1>
                <p class="text-muted small mb-4">
                    The page you are looking for does not exist or may have been moved.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('landing') }}" class="btn btn-avsar-outline">
                        <i class="bi bi-house me-1" aria-hidden="true"></i> Overview
                    </a>
                    <a href="{{ url_for('home_dashboard') }}" class="btn btn-avsar-primary">
                        <i class="bi bi-grid me-1" aria-hidden="true"></i> Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
